    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d12; }
      body { font-family: ui-sans-serif, system-ui, sans-serif; color: #e8ecf4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
      canvas { display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui > * { pointer-events: auto; }
      /* Top right, level with the three corner buttons on the left - a plate
         from the menu kit (see .hud-card in ui/kit.ts). It never takes a touch:
         a shot is a drag from anywhere, the top of the screen included. */
      /* Its left edge stops clear of the three 48px buttons and their 8px gaps,
         so a long place name on a narrow phone wraps instead of sliding under them. */
      #ui > #hud { position: fixed; top: max(env(safe-area-inset-top), 10px);
        right: max(env(safe-area-inset-right), 10px); left: calc(max(env(safe-area-inset-left), 10px) + 172px);
        pointer-events: none; text-align: right; }
      /* Narrow phones stack the skip button under the cog (ui/kit.ts), so
         the card only has to clear two buttons across. */
      @media (max-width: 399px) { #ui > #hud { left: calc(max(env(safe-area-inset-left), 10px) + 116px); } }
      /* Narrower still they stack in one column: one button across. */
      @media (max-width: 319px) { #ui > #hud { left: calc(max(env(safe-area-inset-left), 10px) + 60px); } }
      .overlay { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; background: rgba(8,10,15,.72); backdrop-filter: blur(6px); }
      .overlay h1 { font-size: clamp(28px, 6vw, 56px); letter-spacing: -.02em; }
      .overlay p { opacity: .7; max-width: 34ch; line-height: 1.5; }
      .overlay button { margin-top: 8px; padding: 12px 28px; font: inherit; font-weight: 600; border: 0; border-radius: 999px; background: #e8ecf4; color: #0b0d12; cursor: pointer; }
      .hidden { display: none !important; }
      /* The loading screen: up from the first frame until the title menu is
         (main.ts removes it). Only HTML and CSS, so it shows before any script
         has loaded - YouTube is told about it (firstFrameReady), and the game
         is never a blank page while the code downloads. */
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-content: center; justify-items: center; gap: max(22px, 2.4vmin); background: #0b0d12; }
      /* Past a 900px short side it grows with the screen, as the menus do
         (uiScale in ui/kit.ts) - CSS alone, as no script has run yet. */
      #boot .t { font: 900 clamp(34px, 9vmin, max(64px, 7.1vmin))/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.02em; color: #f8efd9; text-align: center; }
      #boot .bar { width: max(min(180px, 50vw), 20vmin); height: max(6px, .67vmin); border-radius: 999px; background: #ffffff1f; overflow: hidden; }
      #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: #7fae44; animation: boot-run 1.1s ease-in-out infinite; }
      @keyframes boot-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; opacity: .6; } }
    </style>
